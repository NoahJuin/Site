<script type="application/ld+json">{{{jsonLd}}}</script>
<main class="section page article">
  <article class="container narrow">
    <p class="eyebrow"><a href="/blog">Blog</a> · {{dateLabel}}</p>
    <h1>{{heading}}</h1>
    <div class="article-body">{{{content}}}</div>
    <aside class="article-cta card">
      <img src="/img/product-card.png" alt="" width="96" height="96">
      <div>
        <h2>Essayez le bandeau {{shop.name}}</h2>
        <p>Écouteurs extra-plats, occultant, lavable. Livraison offerte et {{shop.returnDays}} nuits pour essayer.</p>
        <a class="btn" href="/#commander">Découvrir le bandeau</a>
      </div>
    </aside>
  </article>
</main>
